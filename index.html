        const CLOUD_RETRY_DELAYS = [4000, 8000, 15000, 30000];

        function clearCloudRetry() {
            if (cloudRetryTimer) clearTimeout(cloudRetryTimer);
            cloudRetryTimer = null;
        }

        function scheduleCloudReconnect() {
            if (cloudRetryTimer || cloudConnectInFlight || ConnectionState.mode === 'cloud') return;
            if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
            const delay = CLOUD_RETRY_DELAYS[Math.min(cloudRetryAttempt, CLOUD_RETRY_DELAYS.length - 1)];
            cloudRetryAttempt += 1;
            cloudRetryTimer = setTimeout(() => {
                cloudRetryTimer = null;
                connectToFirebase();
            }, delay);
        }

        async function retryCloudConnection() {
            if (cloudConnectInFlight) return;
            clearCloudRetry();
            cloudRetryAttempt = 0;
            await connectToFirebase();
        }

        function parseFirebaseConfigInput(rawInput) {
            const trimmed = (rawInput || '').trim();
            if (!trimmed) throw new Error('Vui lòng dán cấu hình Firebase.');
            const startIdx = trimmed.indexOf('{');
            const endIdx = trimmed.lastIndexOf('}');
            if (startIdx === -1 || endIdx === -1 || endIdx <= startIdx) {
                throw new Error('Không tìm thấy cặp dấu ngoặc nhọn { ... } trong đoạn mã bạn dán.');
            }
            let objStr = trimmed.slice(startIdx, endIdx + 1);
            objStr = objStr.replace(/\/\/.*$/gm, '').replace(/\/\*[\s\S]*?\*\//g, '');
            objStr = objStr.replace(/'/g, '"');
            objStr = objStr.replace(/([{,]\s*)([a-zA-Z0-9_]+)\s*:/g, '$1"$2":');
            objStr = objStr.replace(/,\s*}/g, '}');
            const parsed = JSON.parse(objStr);
            if (!parsed.apiKey || !parsed.projectId) throw new Error('Cấu hình thiếu apiKey hoặc projectId.');
            return parsed;
        }

        const LOCAL_STORAGE_KEY = 'smash_open_cup_db_v3';

        function normalizeScoreState(raw, mode, teamAPlayers = [], teamBPlayers = []) {
            if (!raw || typeof raw !== 'object') return null;
            const sourceSets = Array.isArray(raw.sets) ? raw.sets : [];
            const sets = [0, 1, 2].map(i => ({
                a: Math.max(0, Number(sourceSets[i]?.a) || 0),
                b: Math.max(0, Number(sourceSets[i]?.b) || 0)
            }));
            const currentSet = Math.max(0, Math.min(2, Number(raw.currentSet) || 0));
            const positionsA = raw.positionsA || {};
            const positionsB = raw.positionsB || {};
            return {
                sets,
                currentSet,
                setsWonA: Math.max(0, Number(raw.setsWonA) || 0),
                setsWonB: Math.max(0, Number(raw.setsWonB) || 0),
                serverTeam: raw.serverTeam === 'B' ? 'B' : 'A',
                serverPlayerIdx: Math.max(0, Number(raw.serverPlayerIdx) || 0),
                receiverPlayerIdx: Math.max(0, Number(raw.receiverPlayerIdx) || 0),
                positionsA: {
                    right: Number.isInteger(Number(positionsA.right)) ? Number(positionsA.right) : 0,
                    left: Number.isInteger(Number(positionsA.left)) ? Number(positionsA.left) : (mode === 'doubles' && teamAPlayers.length > 1 ? 1 : 0)
                },
                positionsB: {
                    right: Number.isInteger(Number(positionsB.right)) ? Number(positionsB.right) : 0,
                    left: Number.isInteger(Number(positionsB.left)) ? Number(positionsB.left) : (mode === 'doubles' && teamBPlayers.length > 1 ? 1 : 0)
                },
                history: Array.isArray(raw.history) ? raw.history.slice(-200).map(item => makeScoreSnapshot(item || {})) : [],
                status: raw.status === 'finished' ? 'finished' : 'playing',
                finishReason: raw.finishReason || '',
                winner: raw.winner === 'A' || raw.winner === 'B' ? raw.winner : null,
                mode: mode || raw.mode || 'singles'
            };
        }

        function normalizeDatabase(raw) {
            const seed = getSeedData();
            const source = raw && typeof raw === 'object' ? raw : {};
            const normalized = {
                ...seed,
                ...source,
                users: Array.isArray(source.users) ? source.users : seed.users,
                courts: Array.isArray(source.courts) ? source.courts : seed.courts,
                categories: (Array.isArray(source.categories) ? source.categories : seed.categories).map(c => ({
                    ...c,
                    // Mặc định an toàn cho các nội dung cũ: chỉ lấy Nhất bảng; Admin có thể đổi sang 2.
                    qualifiersPerGroup: Number(c.qualifiersPerGroup) === 2 ? 2 : 1
                })),
                athletes: Array.isArray(source.athletes) ? source.athletes : seed.athletes,
                groups: Array.isArray(source.groups) ? source.groups : [],
                matches: Array.isArray(source.matches) ? source.matches : []
            };
            normalized.courts = normalized.courts.map((c, i) => ({
                id: Number(c.id) || i + 1,
                name: c.name || `Sân ${Number(c.id) || i + 1}`,
                refereeId: c.refereeId || '',
                currentMatchId: c.currentMatchId || ''
            })).sort((a, b) => a.id - b.id);
            normalized.groups = normalized.groups.filter(Boolean).map(g => ({
                ...g,
                id: String(g.id || `group_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`),
                categoryId: g.categoryId || '',
                mode: g.mode === 'doubles' ? 'doubles' : 'singles',
                teams: Array.isArray(g.teams) ? g.teams.filter(Boolean).map((t, i) => ({
                    ...t,
                    id: String(t.id || `team_${i}_${Math.random().toString(36).slice(2, 7)}`),
                    name: t.name || (Array.isArray(t.players) ? t.players.join(' & ') : 'Đội chưa đặt tên'),
                    players: Array.isArray(t.players) ? t.players.map(String) : []
                })) : []
            }));
            const groupMap = new Map(normalized.groups.map(g => [g.id, g]));
            normalized.matches = normalized.matches.filter(Boolean).map(m => {
                const group = groupMap.get(String(m.groupId || ''));
                const teamA = m.teamA || {};
                const teamB = m.teamB || {};
                const mode = m.mode || group?.mode || 'singles';
                const playersA = Array.isArray(teamA.players) ? teamA.players : [];
                const playersB = Array.isArray(teamB.players) ? teamB.players : [];
                return {
                    ...m,
                    id: String(m.id || `match_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`),
                    groupId: String(m.groupId || ''),
                    categoryId: m.categoryId || group?.categoryId || '',
                    mode,
                    teamA: { ...teamA, id: String(teamA.id || ''), name: teamA.name || playersA.join(' & ') || 'Đội A', players: playersA.map(String) },
                    teamB: { ...teamB, id: String(teamB.id || ''), name: teamB.name || playersB.join(' & ') || 'Đội B', players: playersB.map(String) },
                    courtId: m.courtId == null || m.courtId === '' ? null : Number(m.courtId),
                    stage: m.stage === 'knockout' ? 'knockout' : 'group',
                    status: ['pending', 'live', 'finished', 'waiting', 'bye'].includes(m.status) ? m.status : 'pending',
                    bracketId: m.bracketId || '',
                    roundIndex: Number.isFinite(Number(m.roundIndex)) ? Number(m.roundIndex) : 0,
                    nextMatchId: m.nextMatchId || '',
                    nextSlot: m.nextSlot === 'B' ? 'B' : 'A',
                    winner: m.winner === 'A' || m.winner === 'B' ? m.winner : null,
                    scoreState: normalizeScoreState(m.scoreState, mode, playersA, playersB)
                };
            });

            // Chỉ giữ trận thuộc một bảng thật và có đủ hai đội trong chính bảng đó.
            // Dữ liệu trận mồ côi/legacy không còn được phép xuất hiện trong lịch.
            normalized.matches = normalized.matches.filter(m => {
                if (m.stage === 'knockout') {
                    const categoryExists = normalized.categories.some(c => c.id === m.categoryId);
                    // Knockout rounds may contain waiting slots with placeholder team names.
                    return categoryExists && !!m.bracketId && !!m.id;
                }
                const group = groupMap.get(m.groupId);
                if (!group || group.categoryId !== m.categoryId) return false;
                const teamIds = new Set(group.teams.map(t => t.id));
                return !!m.teamA.id && !!m.teamB.id && m.teamA.id !== m.teamB.id &&
                    teamIds.has(m.teamA.id) && teamIds.has(m.teamB.id);
            });
            const matchMap = new Map(normalized.matches.map(m => [m.id, m]));
            const claimedMatches = new Set();
            normalized.courts.forEach(c => {
                if (!c.currentMatchId) return;
                const match = matchMap.get(c.currentMatchId);
                if (!match || match.status !== 'live' || Number(match.courtId) !== Number(c.id) || claimedMatches.has(match.id)) {
                    c.currentMatchId = '';
                    return;
                }
                claimedMatches.add(match.id);
            });
            // Trận live nhưng không còn sân hợp lệ sẽ quay về hàng chờ thay vì chiếm một sân ảo.
            normalized.matches.forEach(m => {
                if (m.status === 'live' && !claimedMatches.has(m.id)) {
                    m.status = 'pending';
                    m.courtId = null;
                    if (m.scoreState && m.scoreState.status !== 'finished') m.scoreState.status = 'playing';
                }
            });
            return normalized;
        }

        async function connectToFirebase(customConfig = null) {
            const configToUse = customConfig || activeFirebaseConfig;
            if (!configToUse || !configToUse.apiKey) {
                ConnectionState.mode = 'local';
                ConnectionState.errorMessage = 'Thiếu cấu hình Firebase được nhúng trong website.';
                renderApp();
                return;
            }
            if (cloudConnectInFlight) return;
            cloudConnectInFlight = true;
            clearCloudRetry();
            clearFirebaseSubscriptions();
            cloudCollectionsReady = new Set();
            cloudCollectionsDraft = {};
            cloudInitialHydrationComplete = false;
            ConnectionState.mode = 'connecting';
            ConnectionState.errorMessage = '';
            renderApp();

            try {
                if (firebaseApp) { try { await deleteApp(firebaseApp); } catch (e) {} }
                firebaseApp = initializeApp(configToUse, 'smash_cup_' + Date.now());
                auth = getAuth(firebaseApp);
                db = getFirestore(firebaseApp);

                if (!customConfig && typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try { await signInWithCustomToken(auth, __initial_auth_token); } catch (e) { await signInAnonymously(auth); }
                } else {
                    await signInAnonymously(auth);
                }

                firebaseUser = auth.currentUser;
                if (!firebaseUser) throw new Error('Không thể xác thực Firebase.');

                activeFirebaseConfig = configToUse;
                await syncInitialDataWithCloud();
                subscribeRealtimeCollections();

                ConnectionState.mode = 'cloud';
                ConnectionState.errorMessage = '';
                ConnectionState.lastSavedAt = new Date();
                cloudRetryAttempt = 0;
                if (customConfig) showToast('Kết nối Firebase Cloud thành công!', 'success');
                renderApp();
            } catch (err) {
                clearFirebaseSubscriptions();
                firebaseUser = null;
                ConnectionState.mode = 'local';
                ConnectionState.errorMessage = err?.message || 'Không thể kết nối Cloud';
                console.error('Không thể kết nối Firebase:', err);
                renderApp();
                // Wait until the in-flight flag is cleared in finally before scheduling retry.
                setTimeout(scheduleCloudReconnect, 0);
            } finally {
                cloudConnectInFlight = false;
            }
        }

        function readPendingAthleteOps() {
            try {
                const raw = localStorage.getItem(PENDING_ATHLETE_OPS_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                return Array.isArray(parsed) ? parsed.filter(op => op && op.id && (op.type === 'set' || op.type === 'delete')) : [];
            } catch (e) {
                console.warn('Không đọc được hàng đợi đồng bộ VĐV:', e);
                return [];
            }
        }

        function queueAthleteCloudOperation(type, athleteOrId) {
            const id = typeof athleteOrId === 'string' ? athleteOrId : athleteOrId?.id;
            if (!id) return;
            const ops = readPendingAthleteOps().filter(op => op.id !== String(id));
            if (type === 'set' && typeof athleteOrId === 'object') {
                ops.push({ type: 'set', id: String(id), athlete: athleteOrId, queuedAt: Date.now() });
            } else {
                ops.push({ type: 'delete', id: String(id), queuedAt: Date.now() });
            }
            try { localStorage.setItem(PENDING_ATHLETE_OPS_KEY, JSON.stringify(ops)); }
            catch (e) {
                console.error('Không thể lưu hàng đợi VĐV:', e);
                showToast('Không lưu được hàng đợi đồng bộ VĐV trên trình duyệt. Hãy xuất dữ liệu dự phòng.', 'error');
            }
        }

        async function flushPendingAthleteChanges(options = {}) {
            if (!firebaseUser || !db) return false;
            if (typeof navigator !== 'undefined' && navigator.onLine === false) return false;
            if (ConnectionState.mode !== 'cloud' && !(options.allowDuringConnect && ConnectionState.mode === 'connecting')) return false;
            const ops = readPendingAthleteOps();
            if (!ops.length) return true;
            try {
                for (let i = 0; i < ops.length; i += 400) {
                    const batch = writeBatch(db);
                    ops.slice(i, i + 400).forEach(op => {
                        const ref = getPublicDoc('athletes', op.id);
                        if (op.type === 'delete') batch.delete(ref);
                        else batch.set(ref, op.athlete);
                    });
                    await batch.commit();
                }
                // Only clear the queue after every Firestore batch succeeds.
                localStorage.removeItem(PENDING_ATHLETE_OPS_KEY);
                ConnectionState.lastSavedAt = new Date();
                return true;
            } catch (e) {
                console.error('Chưa thể đồng bộ hàng đợi VĐV:', e);
                if (!options.silent) showToast('VĐV vẫn được lưu trên thiết bị này; Cloud chưa nhận được. Hệ thống sẽ thử đồng bộ lại khi có kết nối.', 'warning');
                return false;
            }
        }

        async function migrateLegacyLocalAthletesToCloud(settingsData = {}) {
            if (!firebaseUser || !db || settingsData.athletesMigrationVersion >= 1) return;
            // Only migrate from a browser that already had a saved snapshot before this version.
            // A brand-new device must never upload demo seed athletes over an existing tournament.
            if (!hadLocalSnapshotAtBoot || !Array.isArray(DB.athletes) || DB.athletes.length === 0) return;
            const cloudSnap = await getDocs(getPublicCol('athletes'));
            const cloudIds = new Set(cloudSnap.docs.map(d => d.id));
            const localOnly = DB.athletes.filter(a => a && a.id && !cloudIds.has(String(a.id)));
            for (let i = 0; i < localOnly.length; i += 400) {
                const batch = writeBatch(db);
                localOnly.slice(i, i + 400).forEach(ath => batch.set(getPublicDoc('athletes', String(ath.id)), ath));
                await batch.commit();
            }
            // Mark only after the old local snapshot has been reconciled successfully.
            await setDoc(getPublicDoc('settings', 'tournament'), {
                athletesMigrationVersion: 1,
                athletesMigratedAt: Date.now()
            }, { merge: true });
            if (localOnly.length) showToast(`Đã khôi phục và đồng bộ ${localOnly.length} VĐV còn lưu trên thiết bị lên Cloud.`, 'success');
        }

        async function syncInitialDataWithCloud() {
            if (!firebaseUser) return;
            const settingsRef = getPublicDoc('settings', 'tournament');
            const settingsSnap = await getDoc(settingsRef);
            if (!settingsSnap.exists()) {
                await pushCurrentStateToCloud();
            } else {
                try {
                    await migrateLegacyLocalAthletesToCloud(settingsSnap.data() || {});
                } catch (e) {
                    console.error('Không thể di chuyển VĐV cũ lên Cloud:', e);
                    showToast('Chưa thể khôi phục VĐV cũ lên Cloud. Dữ liệu cục bộ vẫn được giữ lại.', 'warning');
                }
            }
            // Flush offline/manual/import changes before attaching snapshots so an empty Cloud
            // collection cannot overwrite local-only athletes during the first hydration.
            await flushPendingAthleteChanges({ silent: true, allowDuringConnect: true });
        }

        async function pushCurrentStateToCloud() {
            if (!firebaseUser || !db) return;
            const operations = [];
            operations.push([getPublicDoc('settings', 'tournament'), { tournamentName: DB.tournamentName, updatedAt: Date.now(), athletesMigrationVersion: 1, athletesMigratedAt: Date.now() }]);
            DB.users.forEach(u => operations.push([getPublicDoc('users', u.id), u]));
            DB.courts.forEach(c => operations.push([getPublicDoc('courts', `court_${c.id}`), c]));
            DB.categories.forEach(cat => operations.push([getPublicDoc('categories', cat.id), cat]));
            DB.athletes.forEach(ath => operations.push([getPublicDoc('athletes', ath.id), ath]));
            DB.groups.forEach(grp => {
                const { teams, ...rest } = grp;
                operations.push([getPublicDoc('groups', grp.id), { ...rest, teamsJson: JSON.stringify(teams || []) }]);
            });
            DB.matches.forEach(match => {
                const { scoreState, ...rest } = match;
                operations.push([getPublicDoc('matches', match.id), { ...rest, scoreStateJson: JSON.stringify(scoreState || {}) }]);
            });
            for (let i = 0; i < operations.length; i += 400) {
                const batch = writeBatch(db);
                operations.slice(i, i + 400).forEach(([ref, value]) => batch.set(ref, value));
                await batch.commit();
            }
            ConnectionState.lastSavedAt = new Date();
        }

        function subscribeRealtimeCollections() {
            if (!firebaseUser) return;
            const required = ['users', 'courts', 'categories', 'athletes', 'groups', 'matches'];
            const onErr = (err) => {
                console.error('Firebase realtime error:', err);
                clearFirebaseSubscriptions();
                firebaseUser = null;
                ConnectionState.mode = 'local';
                ConnectionState.errorMessage = err?.message || 'Mất kết nối Firebase';
                renderApp();
                scheduleCloudReconnect();
            };
            const applyCollection = (key, rows) => {
                if (!cloudInitialHydrationComplete) {
                    cloudCollectionsDraft[key] = rows;
                    cloudCollectionsReady.add(key);
                    if (required.every(name => cloudCollectionsReady.has(name))) {
                        DB = normalizeDatabase({ ...DB, ...cloudCollectionsDraft });
                        cloudCollectionsDraft = {};
                        cloudInitialHydrationComplete = true;
                    }
                } else {
                    // Không chuẩn hóa chéo ngay từng collection: Firestore có thể phát snapshot
                    // bảng và trận ở hai thời điểm khác nhau khi tạo/xóa một bảng.
                    DB[key] = rows;
                }
                if (CurrentUser && cloudInitialHydrationComplete) {
                    const refreshedUser = DB.users.find(u => u.id === CurrentUser.id);
                    if (refreshedUser) CurrentUser = refreshedUser;
                    else { CurrentUser = null; UIState.activeCourtId = null; UIState.activeTab = 'live'; }
                }
                if (cloudInitialHydrationComplete) saveLocalSnapshot();
                renderApp();
            };

            unsubscribers.push(onSnapshot(getPublicDoc('settings', 'tournament'), (snap) => {
                if (snap.exists() && snap.data().tournamentName) DB.tournamentName = snap.data().tournamentName;
                renderApp();
            }, onErr));
            unsubscribers.push(onSnapshot(getPublicCol('users'), snap => applyCollection('users', snap.docs.map(d => ({ id: d.id, ...d.data() }))), onErr));
            unsubscribers.push(onSnapshot(getPublicCol('courts'), snap => applyCollection('courts', snap.docs.map(d => ({ id: Number(d.data().id) || Number(String(d.id).replace('court_', '')) || 0, ...d.data() })).sort((a, b) => a.id - b.id)), onErr));
            unsubscribers.push(onSnapshot(getPublicCol('categories'), snap => applyCollection('categories', snap.docs.map(d => {
                const data = d.data();
                return { id: d.id, ...data, qualifiersPerGroup: Number(data.qualifiersPerGroup) === 2 ? 2 : 1 };
            })), onErr));
            unsubscribers.push(onSnapshot(getPublicCol('athletes'), snap => applyCollection('athletes', snap.docs.map(d => ({ id: d.id, ...d.data() }))), onErr));
            unsubscribers.push(onSnapshot(getPublicCol('groups'), snap => applyCollection('groups', snap.docs.map(d => {
                const data = d.data();
                let teams = data.teams || [];
                if (data.teamsJson) { try { teams = JSON.parse(data.teamsJson); } catch (e) { teams = []; } }
                return { id: d.id, ...data, teams };
            })), onErr));
            unsubscribers.push(onSnapshot(getPublicCol('matches'), snap => applyCollection('matches', snap.docs.map(d => {
                const data = d.data();
                let scoreState = data.scoreState || null;
                if (data.scoreStateJson) { try { scoreState = JSON.parse(data.scoreStateJson); } catch (e) { scoreState = null; } }
                return { id: d.id, ...data, scoreState };
            }).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0))), onErr));
        }

                        const batch = writeBatch(db);

                } catch (e) {

            const orphanedKnockout = DB.matches.filter(m => m.stage === 'knockout' && m.categoryId === catId);
            DB.matches = DB.matches.filter(m => !(m.stage === 'knockout' && m.categoryId === catId));

            broadcastLocalUpdate();
            renderApp();

            if (ConnectionState.mode === 'cloud' && firebaseUser) {

                    await deleteDoc(getPublicDoc('categories', catId));

        async function deleteGroup(groupId, fromCategoryDelete = false) {
            if (!CurrentUser || CurrentUser.role !== 'admin') return;
            const group = DB.groups.find(g => g.id === groupId);
            if (!group) return;
            const matchesToDelete = DB.matches.filter(m => m.groupId === groupId);
            // A playoff bracket is based on all groups in its category; deleting any group invalidates it.
            const bracketMatchesToDelete = DB.matches.filter(m => m.stage === 'knockout' && m.categoryId === group.categoryId);
            const allMatchesToDelete = [...matchesToDelete, ...bracketMatchesToDelete];
            const matchIds = new Set(allMatchesToDelete.map(m => m.id));
            const affectedCourts = DB.courts.filter(c => matchIds.has(c.currentMatchId));
            affectedCourts.forEach(c => { c.currentMatchId = ''; });
            DB.groups = DB.groups.filter(g => g.id !== groupId);
            DB.matches = DB.matches.filter(m => !matchIds.has(m.id));
            for (const court of affectedCourts) await persistCourt(court);
            broadcastLocalUpdate();
            renderApp();
            if (!fromCategoryDelete) showToast(bracketMatchesToDelete.length ? 'Đã xóa bảng, lịch liên quan và nhánh loại trực tiếp cũ. Hãy tạo lại nhánh sau khi đủ bảng.' : 'Đã xóa bảng đấu, lịch liên quan và giải phóng sân.', 'info');
            if (ConnectionState.mode === 'cloud' && firebaseUser) {
                try {
                    await deleteDoc(getPublicDoc('groups', groupId));
                    for (const match of allMatchesToDelete) await deleteDoc(getPublicDoc('matches', match.id));
                } catch (e) { showToast('Dữ liệu đã xóa tại máy này nhưng Cloud chưa xóa hết.', 'warning'); }
            }
        }

            if (DB.categories.length === 0) {
                showToast('Chưa có nội dung thi đấu nào!', 'warning');
                return;
            }
            const firstCatId = DB.categories[0].id;
            openAssignMatchModalForCategory(courtId, firstCatId);
        }

        function openAssignMatchModalForCategory(courtId, catId) {
            if (!CurrentUser || CurrentUser.role !== 'admin') return;
            const court = DB.courts.find(c => c.id === Number(courtId));
            if (!court) return;
            const pendingMatches = getPublishedMatches(catId).filter(m => m.status === 'pending' && m.teamA?.id && m.teamB?.id && (m.teamA.players || []).length && (m.teamB.players || []).length && !m.courtId && !DB.courts.some(c => getLiveMatchForCourt(c)?.id === m.id));
            const cat = DB.categories.find(c => c.id === catId);

            openModal(`🏸 Đưa Trận Đấu Lên ${court.name}`, `
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-neutral-400 mb-1">Chọn nội dung thi đấu</label>
                        <select onchange="openAssignMatchModalForCategory(${court.id}, this.value)" class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-700 rounded-xl text-sm text-white">
                            ${DB.categories.map(c => `<option value="${c.id}" ${c.id === catId ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}
                        </select>
                    </div>
                    <div class="space-y-2 max-h-72 overflow-y-auto">
                        ${pendingMatches.length === 0 ? `<div class="py-6 text-center text-xs text-neutral-500">Không có trận đấu chờ nào trong nội dung "${escapeHtml(cat ? cat.name : '')}".</div>` : pendingMatches.map(m => `
                            <div class="p-3 rounded-xl bg-neutral-950 border border-neutral-800 flex items-center justify-between gap-3">
                                <div>
                                    <p class="text-xs text-red-400 font-bold">${escapeHtml(m.roundName || '')}</p>
                                    <p class="text-sm font-extrabold text-white">${escapeHtml(m.teamA.name)} vs ${escapeHtml(m.teamB.name)}</p>
                                </div>
                                <button type="button" onclick="handleAssignMatchToCourt(${court.id}, '${m.id}')" class="px-3.5 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white text-xs font-bold">Đưa lên</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `);
        }

        async function handleAssignMatchToCourt(courtId, matchId) {
            if (!CurrentUser || CurrentUser.role !== 'admin') {
                showToast('Chỉ Admin mới được đưa trận lên sân.', 'error');
                return;
            }
            const court = DB.courts.find(c => c.id === Number(courtId));
            const match = DB.matches.find(m => m.id === matchId);
            if (!court || !match || !isValidPublishedMatch(match)) {
                showToast('Trận đấu không hợp lệ hoặc không thuộc giải đấu này.', 'error');
                return;
            }
            const occupyingMatch = getLiveMatchForCourt(court);
            if (occupyingMatch && occupyingMatch.id !== match.id) {
                showToast(`${court.name} đang có trận khác. Hãy kết thúc hoặc rút trận trước.`, 'warning');
                return;
            }
            // A dangling currentMatchId is stale data, not an active match: clear it and continue.
            if (court.currentMatchId && !occupyingMatch) court.currentMatchId = '';
            if (!court.refereeId || !DB.users.some(u => u.id === court.refereeId && u.role === 'referee')) {
                showToast(`Vui lòng phân công trọng tài hợp lệ cho ${court.name} trước khi đưa trận lên sân.`, 'warning');
                return;
            }
            if (DB.courts.some(c => Number(c.id) !== Number(court.id) && c.refereeId === court.refereeId && getLiveMatchForCourt(c))) {
                showToast('Trọng tài này đang điều khiển một trận ở sân khác.', 'warning');
                return;
            }
            if (match.status !== 'pending' || match.courtId || !match.teamA?.id || !match.teamB?.id ||
                !(match.teamA.players || []).length || !(match.teamB.players || []).length ||
                DB.courts.some(c => c.currentMatchId === match.id && getLiveMatchForCourt(c))) {
                showToast('Trận này chưa đủ đội, đã được phân công hoặc không còn ở trạng thái chờ.', 'warning');
                return;
            }
            court.currentMatchId = match.id;
            match.courtId = court.id;
            match.status = 'live';
            match.startedAt = Date.now();
            if (!match.scoreState) match.scoreState = createInitialScoreState(match.teamA.players, match.teamB.players, match.mode);
            match.scoreState.status = 'playing';
            match.scoreState.winner = null;
            await persistMatchWithCourt(match, court);
            closeModal();
            showToast('Đã đưa trận lên sân. Trọng tài được phân công có thể vào chấm điểm ngay.', 'success');
        }

        async function unassignMatchFromCourt(courtId) {
            if (!CurrentUser || CurrentUser.role !== 'admin') return;
            const court = DB.courts.find(c => c.id === Number(courtId));
            if (!court || !court.currentMatchId) return;
            const match = DB.matches.find(m => m.id === court.currentMatchId);
            court.currentMatchId = '';
            if (match) {
                match.courtId = null;
                match.status = 'pending';
                if (match.scoreState && match.scoreState.status !== 'finished') match.scoreState.status = 'playing';
                await persistMatchWithCourt(match, court);
            } else {
                await persistCourt(court);
            }
            showToast('Đã rút trận khỏi sân. Điểm số hiện tại vẫn được giữ lại.', 'info');
        }

        async function addPoint(matchId, scoringTeam) {
            const match = DB.matches.find(m => m.id === matchId);
            if (!canControlMatch(match)) {
                showToast('Bạn không được phân công điều khiển trận đấu này.', 'error');
                return;
            }
            if (!match.scoreState || match.status !== 'live' || !getCourtForMatch(match)) return;
            if (scoringTeam !== 'A' && scoringTeam !== 'B') return;
            const st = match.scoreState;
            if (st.status === 'finished' || !st.sets[st.currentSet]) return;
            pushScoreHistory(st);
            const setIdx = st.currentSet;
            const previousServerTeam = st.serverTeam;
            if (scoringTeam === 'A') st.sets[setIdx].a += 1;
            else st.sets[setIdx].b += 1;
            const scoreA = st.sets[setIdx].a;
            const scoreB = st.sets[setIdx].b;
            if (scoringTeam === previousServerTeam) {
                if (st.mode === 'doubles') {
                    const positions = scoringTeam === 'A' ? st.positionsA : st.positionsB;
                    if (positions) [positions.right, positions.left] = [positions.left, positions.right];
                }
            } else {
                st.serverTeam = scoringTeam;
            }
            let setWinner = null;
            if ((scoreA >= 21 && scoreA - scoreB >= 2) || scoreA === 30) setWinner = 'A';
            else if ((scoreB >= 21 && scoreB - scoreA >= 2) || scoreB === 30) setWinner = 'B';
            let releasedCourt = null;
            if (setWinner) {
                if (setWinner === 'A') st.setsWonA += 1; else st.setsWonB += 1;
                if (st.setsWonA >= 2 || st.setsWonB >= 2) {
                    st.status = 'finished';
                    st.winner = setWinner;
                    st.finishReason = 'normal';
                    match.winner = setWinner;
                    match.status = 'finished';
                    match.finishedAt = Date.now();
                    releasedCourt = releaseCourtForMatch(match);
                    UIState.activeTab = 'live';
                } else if (st.currentSet < 2) {
                    st.currentSet += 1;
                    st.serverTeam = setWinner;
                }
            }
            await persistMatchWithCourt(match, releasedCourt);
            if (match.stage === 'knockout' && match.status === 'finished') await advanceKnockoutWinner(match);
            if (setWinner && st.status === 'finished') showToast(`Trận đấu kết thúc. Đội ${setWinner} giành chiến thắng!`, 'success');
        }

        async function chooseDoublesServer(matchId, team, playerIdx) {
            const match = DB.matches.find(m => m.id === matchId);
            if (!canControlMatch(match) || !match.scoreState || match.mode !== 'doubles') {
                showToast('Bạn không được phân công điều khiển trận đấu này.', 'error');
                return;
            }
            const st = match.scoreState;
            if (st.status === 'finished' || match.status !== 'live' || !getCourtForMatch(match)) return;
            if (!['A', 'B'].includes(team)) return;
            const players = team === 'A' ? match.teamA.players : match.teamB.players;
            if (!Number.isInteger(Number(playerIdx)) || Number(playerIdx) < 0 || Number(playerIdx) >= players.length) return;
            const ownScore = Number(st.sets[st.currentSet]?.[team.toLowerCase()] || 0);
            const requiredBox = ownScore % 2 === 0 ? 'right' : 'left';
            const positions = team === 'A' ? st.positionsA : st.positionsB;
            if (!positions) return;
            const selected = Number(playerIdx);
            const right = Number(positions.right ?? 0);
            const left = Number(positions.left ?? 0);
            if (selected !== right && selected !== left) {
                showToast('Vị trí VĐV không hợp lệ trong đội.', 'error');
                return;
            }
            // Save the old server/position state first so Undo restores it correctly.
            pushScoreHistory(st);
            if (requiredBox === 'right' && selected === left) {
                positions.right = left;
                positions.left = right;
            } else if (requiredBox === 'left' && selected === right) {
                positions.left = right;
                positions.right = left;
            }
            st.serverTeam = team;
            await persistMatch(match);
            showToast(`${players[selected]} được chọn phát cầu từ ô ${requiredBox === 'right' ? 'phải' : 'trái'} theo luật chẵn/lẻ.`, 'success');
        }

        async function manualSetServer(matchId, team, playerIdx, box) {
            // Backward-compatible handler for older UI controls.
            const match = DB.matches.find(m => m.id === matchId);
            if (!match || match.mode !== 'doubles') return;
            return chooseDoublesServer(matchId, team, playerIdx);
        }

        async function forceEndSet(matchId) {
            const match = DB.matches.find(m => m.id === matchId);
            if (!canControlMatch(match) || !match.scoreState) {
                showToast('Bạn không được phân công điều khiển trận đấu này.', 'error');
                return;
            }
            const st = match.scoreState;
            if (st.status === 'finished') return;
            const current = st.sets[st.currentSet];
            if (!current || current.a === current.b) {
                showToast('Tỷ số đang hòa, không thể tự xác định đội thắng ván. Hãy cập nhật điểm trước.', 'warning');
                return;
            }
            pushScoreHistory(st);
            const setWinner = current.a > current.b ? 'A' : 'B';
            if (setWinner === 'A') st.setsWonA++; else st.setsWonB++;
            let releasedCourt = null;
            if (st.setsWonA >= 2 || st.setsWonB >= 2) {
                st.status = 'finished'; st.winner = setWinner; st.finishReason = 'manual_set_end';
                match.winner = setWinner; match.status = 'finished'; match.finishedAt = Date.now();
                releasedCourt = releaseCourtForMatch(match);
                UIState.activeTab = 'live';
                showToast('Đã kết thúc trận đấu!', 'success');
            } else if (st.currentSet < 2) {
                const endedSet = st.currentSet; st.currentSet++; st.serverTeam = setWinner;
                showToast(`Đã kết thúc Ván ${endedSet + 1}! Chuyển sang Ván ${st.currentSet + 1}.`, 'success');
            }
            await persistMatchWithCourt(match, releasedCourt);
            if (match.stage === 'knockout' && match.status === 'finished') await advanceKnockoutWinner(match);
        }

        async function forceEndMatch(matchId, winner = null) {
            const match = DB.matches.find(m => m.id === matchId);
            if (!canControlMatch(match) || !match.scoreState) {
                showToast('Bạn không được phân công điều khiển trận đấu này.', 'error');
                return;
            }
            if (!winner) {
                openModal('🏆 Xác nhận kết thúc trận đấu', `
                    <p class="text-sm text-neutral-300 mb-4">Chọn đội được công nhận thắng trận. Thao tác này sẽ khóa bảng điểm và giải phóng sân.</p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <button type="button" onclick="forceEndMatch('${match.id}', 'A')" class="p-4 rounded-xl bg-rose-700 hover:bg-rose-600 text-white font-bold">Đội A thắng<br><span class="text-xs font-normal">${escapeHtml(match.teamA.name)}</span></button>
                        <button type="button" onclick="forceEndMatch('${match.id}', 'B')" class="p-4 rounded-xl bg-rose-700 hover:bg-rose-600 text-white font-bold">Đội B thắng<br><span class="text-xs font-normal">${escapeHtml(match.teamB.name)}</span></button>
                    </div>
                    <button type="button" onclick="closeModal()" class="w-full mt-3 py-2 rounded-xl bg-neutral-800 text-neutral-300 text-xs font-bold">Hủy</button>
                `);
                return;
            }
            if (!['A', 'B'].includes(winner)) return;
            const st = match.scoreState;
            if (st.status === 'finished') return;
            pushScoreHistory(st);
            st.status = 'finished'; st.winner = winner; st.finishReason = 'manual_override';
            match.winner = winner;
            if (winner === 'A') st.setsWonA = Math.max(2, st.setsWonA); else st.setsWonB = Math.max(2, st.setsWonB);
            match.status = 'finished'; match.finishedAt = Date.now();
            const releasedCourt = releaseCourtForMatch(match);
            closeModal();
            await persistMatchWithCourt(match, releasedCourt);
            if (match.stage === 'knockout') await advanceKnockoutWinner(match);
            UIState.activeTab = 'live'; renderApp();
            showToast(`Đã kết thúc trận. Đội ${winner} được công nhận chiến thắng.`, 'success');
        }

        async function undoPoint(matchId) {
            const match = DB.matches.find(m => m.id === matchId);
            if (!canControlMatch(match) || !match.scoreState) {
                showToast('Bạn không được phân công điều khiển trận đấu này.', 'error');
                return;
            }
            const st = match.scoreState;
            if (!Array.isArray(st.history) || st.history.length === 0) {
                showToast('Không có thao tác nào để hoàn tác!', 'warning');
                return;
            }
            const previousState = st.history.pop();
            match.scoreState = { ...previousState, history: st.history };
            await persistMatch(match);
            showToast('Đã hoàn tác thao tác điểm số gần nhất!', 'info');
        }

        function getGroupForMatch(match) {
            if (!match || !match.groupId) return null;
            const group = DB.groups.find(g => g.id === match.groupId);
            if (!group || group.categoryId !== match.categoryId) return null;
            const teams = Array.isArray(group.teams) ? group.teams : [];
            const aExists = teams.some(t => t.id === match.teamA?.id);
            const bExists = teams.some(t => t.id === match.teamB?.id);
            return aExists && bExists && match.teamA?.id !== match.teamB?.id ? group : null;
        }

        function isValidPublishedMatch(match) {
            if (!match) return false;
            if (getGroupForMatch(match)) return true;
            return match.stage === 'knockout' && !!match.bracketId &&
                DB.categories.some(c => c.id === match.categoryId) &&
                ['pending', 'live', 'finished', 'waiting', 'bye'].includes(match.status);
        }

        function getPublishedMatches(categoryId = null) {
            return DB.matches.filter(m => isValidPublishedMatch(m) && (!categoryId || m.categoryId === categoryId))
                .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        }

        function getMatchesForGroup(groupId) {
            return DB.matches.filter(m => getGroupForMatch(m) && m.groupId === groupId)
                .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        }

        function getLiveMatchForCourt(court) {
            if (!court || !court.currentMatchId) return null;
            const match = DB.matches.find(m => m.id === court.currentMatchId);
            return match && isValidPublishedMatch(match) && match.status === 'live' &&
                Number(match.courtId) === Number(court.id) ? match : null;
        }

        function getCourtForMatch(match) {
            if (!match) return null;
            return DB.courts.find(c => c.currentMatchId === match.id && Number(c.id) === Number(match.courtId)) || null;
        }

        function canControlMatch(match) {
            if (!CurrentUser || !match) return false;
            if (CurrentUser.role === 'admin') return true;
            if (CurrentUser.role !== 'referee') return false;
            const court = getCourtForMatch(match);
            return !!court && court.refereeId === CurrentUser.id && match.status === 'live';
        }

        function makeScoreSnapshot(st) {
            return {
                sets: (st.sets || []).map(set => ({ a: Number(set.a) || 0, b: Number(set.b) || 0 })),
                currentSet: st.currentSet,
                setsWonA: st.setsWonA,
                setsWonB: st.setsWonB,
                serverTeam: st.serverTeam,
                serverPlayerIdx: st.serverPlayerIdx,
                receiverPlayerIdx: st.receiverPlayerIdx,
                positionsA: { ...(st.positionsA || {}) },
                positionsB: { ...(st.positionsB || {}) },
                status: st.status,
                finishReason: st.finishReason || '',
                winner: st.winner || null,
                mode: st.mode
            };
        }

        function pushScoreHistory(st) {
            if (!Array.isArray(st.history)) st.history = [];
            st.history.push(makeScoreSnapshot(st));
            if (st.history.length > 200) st.history.shift();
        }

        function releaseCourtForMatch(match) {
            const court = getCourtForMatch(match);
            if (!court) return null;
            court.currentMatchId = '';
            if (UIState.activeCourtId === court.id) UIState.activeCourtId = null;
            return court;
        }

        function buildRoundRobinMatches(group) {
            const teams = group.teams || [];
            let pairs = [];
            if (teams.length === 3) {
                pairs = [[0, 1, 'Lượt 1'], [1, 2, 'Lượt 2'], [0, 2, 'Lượt 3']];
            } else if (teams.length === 4) {
                pairs = [[0, 1, 'Lượt 1 (1-2)'], [2, 3, 'Lượt 1 (3-4)'], [0, 2, 'Lượt 2 (1-3)'], [1, 3, 'Lượt 2 (2-4)'], [0, 3, 'Lượt 3 (1-4)'], [1, 2, 'Lượt 3 (2-3)']];
            } else {
                throw new Error('Mỗi bảng phải có đúng 3 hoặc 4 đội.');
            }
            return pairs.map(([a, b, label], idx) => ({
                id: `m_${group.id}_${idx + 1}_${Math.random().toString(36).slice(2, 7)}`,
                categoryId: group.categoryId, mode: group.mode, stage: 'group', groupId: group.id,
                roundName: `${group.name} (${label})`,
                teamA: { id: teams[a].id, name: teams[a].name, players: [...teams[a].players] },
                teamB: { id: teams[b].id, name: teams[b].name, players: [...teams[b].players] },
                courtId: null, status: 'pending',
                scoreState: createInitialScoreState(teams[a].players, teams[b].players, group.mode),
                createdAt: Date.now() + idx
            }));
        }

        function normalizeSearchText(value) {
            return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
        }

        function renderGroupAthletePicker(teamIndex, playerIndex, label) {
            const id = `grp-t${teamIndex}-p${playerIndex}`;
            return `<div class="relative">
                <label class="block text-[10px] uppercase font-bold text-neutral-400 mb-1">${label}</label>
                <input id="${id}-search" type="text" autocomplete="off" oninput="filterGroupAthletes(${teamIndex}, ${playerIndex})" onfocus="filterGroupAthletes(${teamIndex}, ${playerIndex})" placeholder="Gõ tên, CLB hoặc MSSV để tìm..." class="w-full px-3 py-2 bg-neutral-900 border border-neutral-700 rounded-xl text-xs text-white">
                <input id="${id}" type="hidden" value="">
                <div id="${id}-results" class="hidden absolute z-30 top-full left-0 right-0 mt-1 max-h-44 overflow-y-auto rounded-xl border border-neutral-700 bg-neutral-900 shadow-2xl"></div>
                <div id="${id}-selected" class="text-[10px] text-red-400 mt-1 min-h-3">Chưa chọn VĐV</div>
            </div>`;
        }

        function filterGroupAthletes(teamIndex, playerIndex) {
            const id = `grp-t${teamIndex}-p${playerIndex}`;
            const input = document.getElementById(`${id}-search`);
            const hidden = document.getElementById(id);
            const results = document.getElementById(`${id}-results`);
            const selected = document.getElementById(`${id}-selected`);
            if (!input || !hidden || !results) return;
            hidden.value = '';
            if (selected) selected.textContent = 'Chưa chọn VĐV';
            const q = normalizeSearchText(input.value);
            const list = DB.athletes.filter(a => !q || [a.name, a.club, a.phone, a.mssv, a.email].some(v => normalizeSearchText(v).includes(q))).slice(0, 12);
            results.innerHTML = list.length ? list.map(a => `<button type="button" onclick="chooseGroupAthlete(${teamIndex}, ${playerIndex}, '${String(a.id).replace(/'/g, '&#39;')}')" class="w-full text-left px-3 py-2 hover:bg-neutral-800 border-b border-neutral-800 last:border-0"><span class="block text-xs font-bold text-white">${escapeHtml(a.name)}</span><span class="block text-[10px] text-neutral-400">${escapeHtml(a.club || 'Tự do')} · ${escapeHtml(a.mssv || a.phone || '')}</span></button>`).join('') : '<div class="p-3 text-xs text-neutral-500">Không tìm thấy VĐV.</div>';
            results.classList.remove('hidden');
        }

        function chooseGroupAthlete(teamIndex, playerIndex, athleteId) {
            const id = `grp-t${teamIndex}-p${playerIndex}`;
            const athlete = DB.athletes.find(a => a.id === athleteId);
            if (!athlete) return;
            const hidden = document.getElementById(id);
            const input = document.getElementById(`${id}-search`);
            const results = document.getElementById(`${id}-results`);
            const selected = document.getElementById(`${id}-selected`);
            if (hidden) hidden.value = athlete.id;
            if (input) input.value = athlete.name;
            if (results) results.classList.add('hidden');
            if (selected) selected.textContent = `${athlete.club || 'Tự do'}${athlete.mssv ? ` · MSSV ${athlete.mssv}` : ''}`;
        }

        function openCreateGroupModal() {
            if (!CurrentUser || CurrentUser.role !== 'admin') return;
            if (DB.categories.length === 0) {
                showToast('Vui lòng thêm Nội dung thi đấu trước!', 'warning');
                setActiveTab('categories');
                return;
            }
            openModal('📋 Tạo Bảng Đấu & Cấu Hình Số Đội', `

        function handleGroupCategoryChange() {
            const catEl = document.getElementById('grp-category');
            const countEl = document.getElementById('grp-team-count');

        async function handleCreateGroupSubmit(e) {
            e.preventDefault();
            if (!CurrentUser || CurrentUser.role !== 'admin') return;
            const catId = document.getElementById('grp-category').value;
            const grpName = document.getElementById('grp-name').value.trim();
            const teamCount = Number(document.getElementById('grp-team-count').value);
            const cat = DB.categories.find(c => c.id === catId);
            const isDoubles = cat && (cat.mode === 'doubles' || cat.name.toLowerCase().includes('đôi') || cat.name.toLowerCase().includes('nam nữ'));

            if (!cat || ![3, 4].includes(teamCount)) { showToast('Nội dung hoặc số đội trong bảng không hợp lệ.', 'error'); return; }
            if (!grpName) {
                showToast('Vui lòng nhập tên bảng đấu!', 'error');
                return;
            }
            if (DB.groups.some(g => g.categoryId === catId && (g.name || '').trim().toLowerCase() === grpName.toLowerCase())) { showToast('Tên bảng này đã tồn tại trong nội dung đang chọn.', 'warning'); return; }

            const teams = [];
            const allPlayersInGroup = [];
            for (let idx = 1; idx <= teamCount; idx++) {
                const sel1 = document.getElementById(`grp-t${idx}-p1`);
                const sel2 = document.getElementById(`grp-t${idx}-p2`);
                const athleteId1 = sel1 ? sel1.value.trim() : '';
                const athleteId2 = sel2 ? sel2.value.trim() : '';
                const athlete1 = DB.athletes.find(a => a.id === athleteId1);
                const athlete2 = isDoubles ? DB.athletes.find(a => a.id === athleteId2) : null;

                if (!athlete1 || (isDoubles && !athlete2)) {
                    showToast(`Vui lòng chọn đầy đủ VĐV cho Đội ${idx}`, 'error');
                    return;
                }
                if (isDoubles && athlete1.id === athlete2.id) {
                    showToast(`Hai VĐV trong Đội ${idx} không được trùng nhau!`, 'error');
                    return;
                }

                const currentAthletes = isDoubles ? [athlete1, athlete2] : [athlete1];
                for (const athlete of currentAthletes) {
                    if (allPlayersInGroup.includes(athlete.id)) {
                        showToast(`VĐV "${athlete.name}" đã xuất hiện ở đội khác trong bảng này!`, 'error');
                        return;
                    }
                    allPlayersInGroup.push(athlete.id);
                }

                const currentTeamPlayers = currentAthletes.map(a => a.name);
                const teamName = isDoubles ? `${currentTeamPlayers[0]} & ${currentTeamPlayers[1]}` : currentTeamPlayers[0];
                teams.push({ id: `team_${Date.now()}_${idx}_${Math.floor(Math.random()*100000)}`, name: teamName, players: currentTeamPlayers, athleteIds: currentAthletes.map(a => a.id) });
            }

            const groupId = `grp_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
            const newGroup = { id: groupId, name: grpName, categoryId: catId, mode: isDoubles ? 'doubles' : 'singles', teamCount, teams, createdAt: Date.now() };
            
            const newMatches = buildRoundRobinMatches(newGroup);
            await persistGroupAndMatches(newGroup, newMatches);
            closeModal();
            showToast('Đã tạo bảng đấu và lịch thi đấu thành công!', 'success');
        }

        async function importGroupsFromExcel(event) {
            if (!CurrentUser || CurrentUser.role !== 'admin') { showToast('Chỉ Admin mới được import bảng đấu.', 'error'); return; }
            const file = event.target.files?.[0];
            if (!file) return;
            const athleteIdsBeforeImport = new Set(DB.athletes.map(a => a.id));
            let importCommitted = false;
            try {
                if (!window.XLSX) throw new Error('Thư viện Excel chưa tải được. Hãy kiểm tra Internet rồi tải lại trang.');
                const buffer = await file.arrayBuffer();
                const workbook = window.XLSX.read(buffer, { type: 'array' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = window.XLSX.utils.sheet_to_json(sheet, { defval: '', raw: false });
                if (!rows.length) throw new Error('File không có dòng dữ liệu.');
                const normalizeKey = key => normalizeSearchText(key).replace(/[^a-z0-9]/g, '');
                const value = (row, aliases) => {
                    const keys = Object.keys(row);
                    const wanted = aliases.map(normalizeKey);
                    const found = keys.find(k => wanted.includes(normalizeKey(k)));
                    return found == null ? '' : String(row[found] ?? '').trim();
                };
                const defaultCategoryId = document.getElementById('group-import-category')?.value || '';
                const grouped = new Map();
                rows.forEach((row, i) => {
                    const catText = value(row, ['Nội dung', 'Hạng mục', 'Category', 'Event']);
                    let category = catText ? DB.categories.find(c => c.id === catText || normalizeSearchText(c.name) === normalizeSearchText(catText)) : DB.categories.find(c => c.id === defaultCategoryId);
                    if (!category) throw new Error(`Dòng ${i + 2}: Không tìm thấy nội dung thi đấu "${catText || defaultCategoryId}".`);
                    const groupName = value(row, ['Tên bảng', 'Bảng', 'Group', 'Group name']);
                    const teamLabel = value(row, ['Đội', 'Tên đội', 'Team', 'Team name']);
                    const p1 = value(row, ['VĐV 1', 'Vận động viên 1', 'Player 1', 'P1', 'VĐV']);
                    const p2 = value(row, ['VĐV 2', 'Vận động viên 2', 'Player 2', 'P2', 'Partner']);
                    const club1 = value(row, ['CLB 1', 'Câu lạc bộ 1', 'Club 1']);
                    const club2 = value(row, ['CLB 2', 'Câu lạc bộ 2', 'Club 2']);
                    if (!groupName || !p1) throw new Error(`Dòng ${i + 2}: Thiếu Tên bảng hoặc VĐV 1.`);
                    const key = `${category.id}__${normalizeSearchText(groupName)}`;
                    if (!grouped.has(key)) grouped.set(key, { category, groupName, rows: [] });
                    grouped.get(key).rows.push({ teamLabel, p1, p2, club1, club2, line: i + 2 });
                });
                const importGroups = [];
                let createdAthletes = 0;
                for (const item of grouped.values()) {
                    const { category, groupName } = item;
                    if (DB.groups.some(g => g.categoryId === category.id && normalizeSearchText(g.name) === normalizeSearchText(groupName))) {
                        throw new Error(`Bảng "${groupName}" đã tồn tại trong nội dung "${category.name}". Đổi tên bảng trong Excel để tránh ghi đè.`);
                    }
                    if (![3, 4].includes(item.rows.length)) throw new Error(`Bảng "${groupName}" có ${item.rows.length} đội. Mỗi bảng cần đúng 3 hoặc 4 đội.`);
                    const mode = category.mode === 'doubles' ? 'doubles' : 'singles';
                    const teams = [];
                    const usedAthleteIds = new Set();
                    item.rows.forEach((r, idx) => {
                        if (mode === 'doubles' && !r.p2) throw new Error(`Dòng ${r.line}: Nội dung đánh đôi cần nhập VĐV 2.`);
                        if (mode === 'singles' && r.p2) throw new Error(`Dòng ${r.line}: Nội dung đánh đơn không cần VĐV 2.`);
                        const before = DB.athletes.length;
                        const athlete1 = getOrCreateAthleteByImportedName(r.p1, r.club1);
                        const athlete2 = mode === 'doubles' ? getOrCreateAthleteByImportedName(r.p2, r.club2) : null;
                        createdAthletes += DB.athletes.length - before;
                        const selected = athlete2 ? [athlete1, athlete2] : [athlete1];
                        for (const a of selected) {
                            if (!a || usedAthleteIds.has(a.id)) throw new Error(`Bảng "${groupName}": VĐV "${a?.name || ''}" bị trùng trong cùng một bảng.`);
                            usedAthleteIds.add(a.id);
                        }
                        const players = selected.map(a => a.name);
                        teams.push({ id: `team_imp_${Date.now()}_${idx}_${Math.random().toString(36).slice(2, 6)}`, name: r.teamLabel || players.join(' & '), players, athleteIds: selected.map(a => a.id) });
                    });
                    const group = { id: `grp_imp_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`, name: groupName, categoryId: category.id, mode, teamCount: teams.length, teams, createdAt: Date.now() };
                    importGroups.push({ group, matches: buildRoundRobinMatches(group) });
                }
                // Validate everything before persisting so a malformed workbook cannot create half a group.
                for (const pack of importGroups) await persistGroupAndMatches(pack.group, pack.matches);
                if (createdAthletes) {
                    const importedAthletes = DB.athletes.filter(a => !athleteIdsBeforeImport.has(a.id));
                    importedAthletes.forEach(athlete => queueAthleteCloudOperation('set', athlete));
                    broadcastLocalUpdate();
                    const synced = await flushPendingAthleteChanges({ silent: true });
                    if (!synced) showToast('Bảng đấu đã nhập, nhưng VĐV mới đang chờ đồng bộ Cloud.', 'warning');
                }
                importCommitted = true;
                closeModal();
                showToast(`Đã import ${importGroups.length} bảng đấu, ${importGroups.reduce((n, p) => n + p.matches.length, 0)} trận và ${createdAthletes} VĐV mới.`, 'success');
            } catch (err) {
                if (!importCommitted) DB.athletes = DB.athletes.filter(a => athleteIdsBeforeImport.has(a.id));
                console.error('Import bảng đấu lỗi:', err);
                showToast(err.message || 'Không thể đọc file Excel.', 'error');
            } finally {
                event.target.value = '';
            }
        }

        function computeGroupStandings(group) {
            const groupMatches = getMatchesForGroup(group.id);
            const expectedMatches = (group.teams.length * (group.teams.length - 1)) / 2;
            const complete = groupMatches.length === expectedMatches && groupMatches.every(m => m.status === 'finished' && m.scoreState?.winner);
            const stats = group.teams.map(t => ({
                teamId: t.id, teamName: t.name, players: t.players, played: 0, won: 0, lost: 0,
                matchDiff: 0, setsWon: 0, setsLost: 0, setsDiff: 0,
                pointsFor: 0, pointsAgainst: 0, pointsDiff: 0, matchPoints: 0
            }));
            groupMatches.forEach(m => {
                if (m.status !== 'finished' || !m.scoreState || !m.scoreState.winner) return;
                const rowA = stats.find(s => s.teamId === m.teamA.id);
                const rowB = stats.find(s => s.teamId === m.teamB.id);
                if (!rowA || !rowB) return;
                rowA.played++; rowB.played++;
                let pA = 0, pB = 0;
                (m.scoreState.sets || []).forEach(set => { pA += Number(set.a || 0); pB += Number(set.b || 0); });
                rowA.pointsFor += pA; rowA.pointsAgainst += pB;
                rowB.pointsFor += pB; rowB.pointsAgainst += pA;
                rowA.setsWon += Number(m.scoreState.setsWonA || 0);
                rowA.setsLost += Number(m.scoreState.setsWonB || 0);
                rowB.setsWon += Number(m.scoreState.setsWonB || 0);
                rowB.setsLost += Number(m.scoreState.setsWonA || 0);
                if (m.scoreState.winner === 'A') { rowA.won++; rowA.matchPoints += 1; rowB.lost++; }
                else { rowB.won++; rowB.matchPoints += 1; rowA.lost++; }
            });
            stats.forEach(r => { r.matchDiff = r.won - r.lost; r.setsDiff = r.setsWon - r.setsLost; r.pointsDiff = r.pointsFor - r.pointsAgainst; });
            stats.sort((a, b) => b.won - a.won || b.setsDiff - a.setsDiff || b.pointsDiff - a.pointsDiff || b.pointsFor - a.pointsFor || a.teamName.localeCompare(b.teamName, 'vi'));
            const sameRank = (a, b) => !!a && !!b && a.won === b.won && a.setsDiff === b.setsDiff && a.pointsDiff === b.pointsDiff && a.pointsFor === b.pointsFor;
            stats.forEach((r, i) => { r.rank = i + 1; r.tied = sameRank(r, stats[i - 1]) || sameRank(r, stats[i + 1]); });
            return Object.assign(stats, { complete, expectedMatches, playedMatches: groupMatches.filter(m => m.status === 'finished').length, isUniqueLeader: complete && stats.length > 0 && !sameRank(stats[0], stats[1]) });
        }

        function isGroupFullyComplete(group, qualifiersPerGroup = 1) {
            const standings = computeGroupStandings(group);
            const places = Math.max(1, Math.min(2, Number(qualifiersPerGroup) || 1));
            if (!standings.complete || standings.length < places) return false;
            // Chỉ cần tie-break ở các vị trí thực sự được chọn đi tiếp.
            for (let i = 0; i < places; i++) if (standings[i]?.tied) return false;
            return true;
        }

        function compareGroupNames(a, b) {
            return String(a?.name || '').localeCompare(String(b?.name || ''), 'vi', { numeric: true, sensitivity: 'base' });
        }

            if (getCategoryPlayoffMatches(categoryId).length) {

            await persistCategory({ ...category, qualifiersPerGroup: count });
            showToast(`Đã lưu: ${count} đội mỗi bảng được vào vòng trong.`, 'success');

        function requestDeletePlayoffBracket(categoryId) {
            if (!CurrentUser || CurrentUser.role !== 'admin') return;
            const matches = getCategoryPlayoffMatches(categoryId);
            if (!matches.length) return;
            if (matches.some(m => m.status === 'live')) {
                showToast('Không thể xóa nhánh khi vẫn còn trận loại trực tiếp đang thi đấu.', 'warning');
                return;
            }
            openConfirmModal('Xóa nhánh loại trực tiếp?', 'Thao tác này sẽ xóa toàn bộ trận và kết quả ở nhánh loại trực tiếp của nội dung này. Vòng bảng vẫn được giữ nguyên.', 'executeDeletePlayoffBracket', categoryId);
        }

        async function executeDeletePlayoffBracket(categoryId) {
            if (!CurrentUser || CurrentUser.role !== 'admin') return;
            const matches = getCategoryPlayoffMatches(categoryId);
            if (matches.some(m => m.status === 'live')) { showToast('Không thể xóa nhánh đang có trận thi đấu.', 'warning'); return; }
            const ids = new Set(matches.map(m => m.id));
            const affectedCourts = DB.courts.filter(c => ids.has(c.currentMatchId));
            affectedCourts.forEach(c => { c.currentMatchId = ''; });
            DB.matches = DB.matches.filter(m => !ids.has(m.id));
            broadcastLocalUpdate();
            renderApp();
            if (ConnectionState.mode === 'cloud' && firebaseUser) {
                try {
                    await Promise.all(matches.map(m => deleteDoc(getPublicDoc('matches', m.id))));
                    await Promise.all(affectedCourts.map(c => setDoc(getPublicDoc('courts', `court_${c.id}`), c)));
                } catch (err) {
                    console.error('Lỗi xóa nhánh Cloud:', err);
                    showToast('Đã xóa nhánh trên thiết bị nhưng một số dữ liệu Cloud chưa xóa được.', 'warning');
                    return;
                }
            }
            showToast('Đã xóa nhánh loại trực tiếp. Bạn có thể đổi số đội đi tiếp và tạo lại.', 'success');
        }

        function getCategoryPlayoffMatches(categoryId) {
            return DB.matches.filter(m => m.stage === 'knockout' && m.categoryId === categoryId && m.bracketId)
                .sort((a, b) => Number(a.roundIndex || 0) - Number(b.roundIndex || 0) || Number(a.matchIndex || 0) - Number(b.matchIndex || 0));
        }

        function compareStandingRows(a, b) {
            return (b.won - a.won) || (b.setsDiff - a.setsDiff) || (b.pointsDiff - a.pointsDiff) || (b.pointsFor - a.pointsFor) || a.teamName.localeCompare(b.teamName, 'vi');
        }

        function playoffRoundName(bracketSize, roundIndex) {
            const playersEnteringRound = bracketSize / (2 ** roundIndex);
            if (playersEnteringRound <= 2) return 'Chung kết';
            if (playersEnteringRound === 4) return 'Bán kết';
            if (playersEnteringRound === 8) return 'Tứ kết';
            if (playersEnteringRound === 16) return 'Vòng 1/8';
            if (playersEnteringRound === 32) return 'Vòng 1/16';
            if (playersEnteringRound === 64) return 'Vòng 1/32';
            return `Vòng ${roundIndex + 1}`;
        }

        async function generatePlayoffBracket(categoryId) {
            if (!CurrentUser || CurrentUser.role !== 'admin') return;
            const category = DB.categories.find(c => c.id === categoryId);
            const groups = DB.groups.filter(g => g.categoryId === categoryId).sort(compareGroupNames);
            const qualifiersPerGroup = Number(category?.qualifiersPerGroup) === 2 ? 2 : 1;
            if (!category || !groups.length) { showToast('Chưa có bảng đấu để chia nhánh.', 'warning'); return; }
            if (groups.length < 2) { showToast('Cần ít nhất 2 bảng để ghép Nhất Bảng 1 gặp Nhất Bảng 2.', 'warning'); return; }
            if (getCategoryPlayoffMatches(categoryId).length) { showToast('Nhánh loại trực tiếp đã được tạo. Hãy xóa nhánh cũ trước khi tạo lại.', 'warning'); return; }

            // Collect qualifiers by rank pool: all first-place teams, then all second-place teams.
            const rankPools = Array.from({ length: qualifiersPerGroup }, () => []);
            for (const group of groups) {
                const standings = computeGroupStandings(group);
                if (!standings.complete) {
                    showToast(`Bảng "${group.name}" chưa hoàn tất toàn bộ trận vòng bảng.`, 'warning');
                    return;
                }
                if (standings.length < qualifiersPerGroup) {
                    showToast(`Bảng "${group.name}" không đủ ${qualifiersPerGroup} đội để đi tiếp.`, 'warning');
                    return;
                }
                for (let rank = 0; rank < qualifiersPerGroup; rank++) {
                    if (standings[rank]?.tied) {
                        showToast(`Bảng "${group.name}" đang đồng hạng ở vị trí ${rank + 1}, cần xử lý tie-break trước khi chia nhánh.`, 'warning');
                        return;
                    }
                    const row = standings[rank];
                    const team = group.teams.find(t => t.id === row.teamId);
                    if (!team) { showToast(`Không xác định được đội hạng ${rank + 1} của bảng "${group.name}".`, 'error'); return; }
                    rankPools[rank].push({
                        groupId: group.id,
                        groupName: group.name,
                        rank: rank + 1,
                        team: { id: team.id, name: team.name, players: [...(team.players || [])] },
                        standing: row
                    });
                }
            }

            const qualifiersCount = rankPools.reduce((sum, pool) => sum + pool.length, 0);
            const bracketSize = Math.max(2, 2 ** Math.ceil(Math.log2(qualifiersCount)));
            const matchSlots = bracketSize / 2;
            // Exactly this many first-round matches can be real head-to-head games;
            // the remaining qualifiers receive BYEs. This keeps a complete binary bracket.
            let realMatchSlots = qualifiersCount - matchSlots;
            const realPairs = [];
            const usedQualifiers = new Set();

            // Keep each rank in its own half of the bracket so first-place teams
            // play only first-place teams until that track is completed, and likewise for second place.
            // Each rank pool receives an equal number of first-round slots; missing entries become BYEs.
            const firstRoundPairs = [];
            const slotsPerRank = matchSlots / qualifiersPerGroup;
            for (const pool of rankPools) {
                const realMatchesForPool = pool.length - slotsPerRank;
                if (realMatchesForPool < 0 || realMatchesForPool > Math.floor(pool.length / 2)) {
                    showToast('Không thể phân bổ nhánh cân bằng theo thứ hạng. Hãy kiểm tra số bảng.', 'error');
                    return;
                }
                for (let i = 0; i < realMatchesForPool; i++) {
                    const a = pool[i * 2], b = pool[i * 2 + 1];
                    if (!a || !b) { showToast('Thiếu đội để ghép cặp loại trực tiếp.', 'error'); return; }
                    firstRoundPairs.push([a, b]);
                    realPairs.push([a, b]);
                    usedQualifiers.add(a);
                    usedQualifiers.add(b);
                    realMatchSlots--;
                }
                for (const entry of pool) {
                    if (!usedQualifiers.has(entry)) firstRoundPairs.push([entry, null]);
                }
            }
            if (realMatchSlots !== 0) {
                showToast('Không thể ghép đủ cặp đấu theo thứ hạng bảng. Hãy kiểm tra lại số bảng và số đội đi tiếp.', 'error');
                return;
            }
            if (firstRoundPairs.length !== matchSlots) {
                showToast('Không thể tạo nhánh cân bằng. Vui lòng kiểm tra số lượng đội đi tiếp.', 'error');
                return;
            }

            const roundCount = Math.log2(bracketSize);
            const bracketId = `bracket_${categoryId}_${Date.now()}`;
            const newMatches = [];
            for (let r = 0; r < roundCount; r++) {
                const matchCount = bracketSize / (2 ** (r + 1));
                for (let i = 0; i < matchCount; i++) {
                    const id = `ko_${bracketId}_${r}_${i}`;
                    let teamA = { id: '', name: 'Chờ đội thắng trận trước', players: [] };
                    let teamB = { id: '', name: 'Chờ đội thắng trận trước', players: [] };
                    let status = 'waiting';
                    let winner = null;
                    if (r === 0) {
                        const pair = firstRoundPairs[i] || [null, null];
                        const entryA = pair[0], entryB = pair[1];
                        if (entryA?.team) teamA = { ...entryA.team, players: [...entryA.team.players] };
                        if (entryB?.team) teamB = { ...entryB.team, players: [...entryB.team.players] };
                        if (entryA?.team && entryB?.team) status = 'pending';
                        else if (entryA?.team || entryB?.team) {
                            status = 'bye';
                            winner = entryA?.team ? 'A' : 'B';
                        }
                    }
                    const nextMatchId = r < roundCount - 1 ? `ko_${bracketId}_${r + 1}_${Math.floor(i / 2)}` : '';
                    const isFinalRound = r === roundCount - 1;
                    const matchesPerRankTrack = !isFinalRound ? slotsPerRank / (2 ** r) : 0;
                    const rankTrackNumber = !isFinalRound && matchesPerRankTrack > 0 ? Math.floor(i / matchesPerRankTrack) + 1 : 0;
                    const qualifierRankLabel = isFinalRound ? 'Chung kết' : (rankTrackNumber === 1 ? 'Nhất bảng' : rankTrackNumber === 2 ? 'Nhì bảng' : '');
                    newMatches.push({
                        id, categoryId, mode: category.mode || 'singles', stage: 'knockout', bracketId,
                        roundIndex: r, matchIndex: i,
                        roundName: playoffRoundName(bracketSize, r), qualifierRankLabel,
                        teamA, teamB, courtId: null, status, winner,
                        nextMatchId, nextSlot: i % 2 === 0 ? 'A' : 'B',
                        createdAt: Date.now() + r * 100 + i,
                        scoreState: status === 'pending' ? createInitialScoreState(teamA.players, teamB.players, category.mode || 'singles') : null
                    });
                }
            }

            try {
                await persistMatchesBatch(newMatches);
                for (const match of newMatches.filter(m => m.status === 'bye')) await advanceKnockoutWinner(match);
                const pairingText = qualifiersPerGroup === 1
                    ? 'Nhất bảng gặp Nhất bảng liền kề'
                    : 'Nhất gặp Nhất, Nhì gặp Nhì giữa các bảng liền kề';
                showToast(`Đã tạo nhánh ${qualifiersCount} đội. ${pairingText}.`, 'success');
            } catch (err) {
                console.error('Không thể tạo nhánh loại trực tiếp:', err);
                showToast('Tạo nhánh chưa hoàn tất do lỗi lưu dữ liệu. Vui lòng kiểm tra kết nối rồi thử lại.', 'error');
            }
        }

        async function advanceKnockoutWinner(match) {
            if (!match || match.stage !== 'knockout' || !match.nextMatchId) return;
            const winnerSide = match.winner || match.scoreState?.winner;
            if (!['A', 'B'].includes(winnerSide)) return;
            const winnerTeam = winnerSide === 'A' ? match.teamA : match.teamB;
            if (!winnerTeam?.id) return;
            const next = DB.matches.find(m => m.id === match.nextMatchId);
            if (!next || next.stage !== 'knockout') return;
            const slot = match.nextSlot === 'B' ? 'teamB' : 'teamA';
            if (next[slot]?.id === winnerTeam.id) return;
            next[slot] = { id: winnerTeam.id, name: winnerTeam.name, players: [...(winnerTeam.players || [])] };
            if (next.teamA?.id && next.teamB?.id) {
                next.status = 'pending';
                next.scoreState = createInitialScoreState(next.teamA.players, next.teamB.players, next.mode);
            } else {
                next.status = 'waiting';
                next.scoreState = null;
            }
            await persistMatch(next);
        }
