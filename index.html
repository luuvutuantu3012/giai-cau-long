        function checkAthleteDuplicate(candidate, list) {
            const candName = String(candidate.name || '').trim();
            const candNormName = normalizeSearchText(candName);
            const candPhone = String(candidate.phone || '').replace(/[^0-9]/g, '');
            const candMssv = String(candidate.mssv || '').trim().toLowerCase();
            const candEmail = String(candidate.email || '').trim().toLowerCase();
            const candClub = String(candidate.club || '').trim();
            const candClubNorm = normalizeSearchText(candClub);
            const isCandClubDefault = !candClubNorm || candClubNorm === 'tu do';

            for (const existing of list) {
                const exName = String(existing.name || '').trim();
                const exNormName = normalizeSearchText(exName);
                const exPhone = String(existing.phone || '').replace(/[^0-9]/g, '');
                const exMssv = String(existing.mssv || '').trim().toLowerCase();
                const exEmail = String(existing.email || '').trim().toLowerCase();
                const exClub = String(existing.club || '').trim();
                const exClubNorm = normalizeSearchText(exClub);
                const isExClubDefault = !exClubNorm || exClubNorm === 'tu do';

                // 1. Lọc trùng MSSV (nếu cả 2 đều có MSSV)
                if (candMssv && exMssv && candMssv === exMssv) {
                    return { isDuplicate: true, reason: `Trùng MSSV (${existing.mssv}) với VĐV "${existing.name}"`, match: existing };
                }

                // 2. Lọc trùng SĐT (nếu cả 2 đều có SĐT và độ dài >= 9 số)
                if (candPhone && exPhone && candPhone.length >= 9 && candPhone === exPhone) {
                    return { isDuplicate: true, reason: `Trùng SĐT (${existing.phone}) với VĐV "${existing.name}"`, match: existing };
                }

                // 3. Lọc trùng Email (nếu cả 2 đều có email)
                if (candEmail && exEmail && candEmail === exEmail) {
                    return { isDuplicate: true, reason: `Trùng Email (${existing.email}) với VĐV "${existing.name}"`, match: existing };
                }

                // 4. Lọc trùng Tên: sau khi lọc trùng tên thì kiểm tra lọc tiếp MSSV, SĐT và CLB họ đang ở
                if (candNormName && exNormName && candNormName === exNormName) {
                    // Nếu cùng CLB (và không phải đều là Tự do) -> Coi là cùng 1 người bị trùng
                    if (!isCandClubDefault && !isExClubDefault && candClubNorm === exClubNorm) {
                        return { isDuplicate: true, reason: `Trùng Tên & cùng CLB "${existing.club}" với VĐV "${existing.name}"`, match: existing };
                    }

                    // Nếu có thông tin phân biệt (khác MSSV, hoặc khác SĐT, hoặc khác CLB rõ rệt)
                    const hasDifferentMssv = candMssv && exMssv && candMssv !== exMssv;
                    const hasDifferentPhone = candPhone && exPhone && candPhone.length >= 9 && exPhone.length >= 9 && candPhone !== exPhone;
                    const hasDifferentClub = !isCandClubDefault && !isExClubDefault && candClubNorm !== exClubNorm;

                    if (hasDifferentMssv || hasDifferentPhone || hasDifferentClub) {
                        // 2 người khác nhau cùng họ tên nhưng khác MSSV/SĐT/CLB -> Không coi là trùng lặp!
                        continue;
                    }

                    // Nếu không có thông tin đối chứng nào khác biệt (đều không có MSSV, không có SĐT, CLB đều Tự do) -> Trùng tên
                    return { isDuplicate: true, reason: `Trùng họ tên với VĐV "${existing.name}"`, match: existing };
                }
            }

            return { isDuplicate: false };
        }

        async function handleAthletesImport(event) {
            if (!CurrentUser || CurrentUser.role !== 'admin') { showToast('Chỉ Admin mới được import VĐV.', 'error'); return; }
            const file = event.target.files?.[0];
            if (!file) return;

            const catIdEl = document.getElementById('import-cat-id');
            const targetCategoryId = catIdEl ? catIdEl.value : '';

            let count = 0;
            let dupCount = 0;
            const dupReasons = [];

            function parseCSVText(text) {
                const lines = text.split(/\r?\n/);
                const result = [];
                for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed) continue;
                    const cols = [];
                    let val = '';
                    let inQuotes = false;
                    for (let i = 0; i < trimmed.length; i++) {
                        const ch = trimmed[i];
                        if (ch === '"') {
                            if (inQuotes && trimmed[i + 1] === '"') { val += '"'; i++; }
                            else inQuotes = !inQuotes;
                        } else if (ch === ',' && !inQuotes) {
                            cols.push(val.trim());
                            val = '';
                        } else {
                            val += ch;
                        }
                    }
                    cols.push(val.trim());
                    result.push(cols);
                }
                return result;
            }

            try {
                let parsedRows = [];

                if (window.XLSX) {
                    try {
                        const buffer = await file.arrayBuffer();
                        const workbook = window.XLSX.read(buffer, { type: 'array' });
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        parsedRows = window.XLSX.utils.sheet_to_json(sheet, { defval: '', raw: false });
                    } catch (e) {
                        console.warn('Đọc bằng XLSX không thành công, chuyển sang parser văn bản CSV:', e);
                    }
                }

                if (!parsedRows || parsedRows.length === 0) {
                    const text = (await file.text()).replace(/^\uFEFF/, '');
                    const matrix = parseCSVText(text);
                    if (matrix.length > 1) {
                        const headers = matrix[0];
                        for (let i = 1; i < matrix.length; i++) {
                            const rowObj = {};
                            headers.forEach((h, idx) => { rowObj[h || `col_${idx}`] = matrix[i][idx] || ''; });
                            rowObj.__rawCols = matrix[i];
                            parsedRows.push(rowObj);
                        }
                    } else if (matrix.length === 1) {
                        parsedRows.push({ __rawCols: matrix[0] });
                    }
                }

                if (!parsedRows.length) throw new Error('File không có dòng dữ liệu hợp lệ để import.');

                const normalizeKey = key => normalizeSearchText(key).replace(/[^a-z0-9]/g, '');
                const getVal = (row, aliases) => {
                    const keys = Object.keys(row);
                    const wanted = aliases.map(normalizeKey);
                    const found = keys.find(k => wanted.includes(normalizeKey(k)));
                    return found ? String(row[found] || '').trim() : '';
                };

                const nameAliases = ['hoten', 'hovaten', 'ten', 'tenvdv', 'athlete', 'name', 'vdv', 'fullname', 'player', 'vandongvien'];
                const phoneAliases = ['sdt', 'sodienthoai', 'dienthoai', 'phone', 'telephone', 'mobile', 'tel'];
                const mssvAliases = ['mssv', 'masosinhvien', 'masv', 'masovdv', 'studentid', 'id'];
                const clubAliases = ['clb', 'caulacbo', 'donvi', 'coquan', 'truong', 'khoa', 'club', 'team', 'unit'];
                const emailAliases = ['email', 'thu', 'mail'];

                // Partner (cho trường hợp đôi hàng ngang)
                const pNameAliases = ['hoten2', 'hovaten2', 'ten2', 'vdv2', 'partner', 'dongdoi', 'vdvphu', 'player2'];
                const pPhoneAliases = ['sdt2', 'sodienthoai2', 'phone2', 'mobile2'];
                const pMssvAliases = ['mssv2', 'masosinhvien2', 'masv2', 'studentid2'];
                const pClubAliases = ['clb2', 'caulacbo2', 'donvi2', 'club2'];
                const pEmailAliases = ['email2', 'mail2'];

                const processAth = (name, phone, mssv, email, club) => {
                    const cleanName = String(name || '').trim();
                    if (!cleanName || cleanName.length < 2) return;
                    const lower = cleanName.toLowerCase();
                    if (lower.includes('đôi') || lower.includes('bảng') || lower.includes('đơn')) return;
                    if (/^\d+$/.test(cleanName)) return;

                    const candidate = {
                        name: cleanName,
                        phone: String(phone || '').trim(),
                        mssv: String(mssv || '').trim(),
                        email: String(email || '').trim(),
                        club: String(club || '').trim() || 'Tự do',
                        categoryId: targetCategoryId || ''
                    };

                    const dupCheck = checkAthleteDuplicate(candidate, DB.athletes);
                    if (dupCheck.isDuplicate) {
                        dupCount++;
                        dupReasons.push(`${candidate.name}: ${dupCheck.reason}`);
                        return;
                    }

                    const athlete = {
                        id: `ath_${Date.now()}_${Math.floor(Math.random() * 100000)}`,
                        ...candidate
                    };
                    DB.athletes.push(athlete);
                    queueAthleteCloudOperation('set', athlete);
                    count++;
                };

                for (const row of parsedRows) {
                    let mainName = getVal(row, nameAliases);
                    let mainPhone = getVal(row, phoneAliases);
                    let mainMssv = getVal(row, mssvAliases);
                    let mainClub = getVal(row, clubAliases);
                    let mainEmail = getVal(row, emailAliases);

                    let partnerName = getVal(row, pNameAliases);
                    let partnerPhone = getVal(row, pPhoneAliases);
                    let partnerMssv = getVal(row, pMssvAliases);
                    let partnerClub = getVal(row, pClubAliases);
                    let partnerEmail = getVal(row, pEmailAliases);

                    // Fallback theo vị trí cột nếu file không có header khớp alias
                    const rawCols = row.__rawCols || Object.values(row);
                    if (!mainName && rawCols.length >= 2) {
                        if (/^\d+$/.test(String(rawCols[0]).trim())) {
                            mainName = rawCols[1] || '';
                            mainMssv = rawCols[2] || '';
                            mainPhone = rawCols[3] || '';
                            mainClub = rawCols[4] || 'Tự do';
                        } else {
                            mainName = rawCols[0] || '';
                            mainMssv = rawCols[1] || '';
                            mainPhone = rawCols[2] || '';
                            mainClub = rawCols[3] || 'Tự do';
                        }
                    }

                    // Tương thích format form 15 cột cũ (nếu có)
                    if (rawCols.length >= 15 && !partnerName) {
                        partnerName = rawCols[10] || '';
                        partnerPhone = rawCols[11] || '';
                        partnerClub = rawCols[12] || 'Tự do';
                        partnerMssv = rawCols[13] || '';
                        partnerEmail = rawCols[14] || '';
                    }

                    if (mainName) processAth(mainName, mainPhone, mainMssv, mainEmail, mainClub);
                    if (partnerName) processAth(partnerName, partnerPhone, partnerMssv, partnerEmail, partnerClub);
                }

                broadcastLocalUpdate();
                const synced = await flushPendingAthleteChanges({ silent: true });

                if (count > 0) {
                    const dupText = dupCount > 0 ? ` (Đã lọc bỏ ${dupCount} VĐV trùng Tên, MSSV, SĐT hoặc CLB)` : '';
                    showToast(`Đã import thành công ${count} VĐV mới${dupText}!`, 'success');
                } else if (dupCount > 0) {
                    showToast(`Tất cả ${dupCount} VĐV trong file đều đã tồn tại (trùng Tên, MSSV, SĐT hoặc CLB).`, 'warning');
                } else {
                    showToast('Không tìm thấy VĐV hợp lệ trong file.', 'info');
                }

                closeModal();
                renderApp();
            } catch (err) {
                console.error('Import VĐV thất bại:', err);
                showToast(err.message || 'Lỗi khi đọc file CSV / Excel.', 'error');
            } finally {
                event.target.value = '';
            }
        }

        async function handleCreateAthleteSubmit(e) {
            e.preventDefault();
            if (!CurrentUser || CurrentUser.role !== 'admin') return;
            const name = document.getElementById('ath-name').value.trim();
            const phone = document.getElementById('ath-phone').value.trim();
            const mssv = document.getElementById('ath-mssv').value.trim();
            const email = document.getElementById('ath-email').value.trim();
            const club = document.getElementById('ath-club').value.trim() || 'Tự do';
            if (!name) return;

            const duplicateCheck = checkAthleteDuplicate({ name, phone, mssv, email, club }, DB.athletes);
            if (duplicateCheck.isDuplicate) {
                showToast(`Vận động viên này đã tồn tại trong hệ thống (${duplicateCheck.reason})!`, 'warning');
                return;
            }

            await persistAthlete({ id: `ath_${Date.now()}`, name, club, phone, mssv, email });
            closeModal();
            showToast('Đã thêm VĐV thành công!', 'success');
        }

        async function handleCreateCategorySubmit(e) {
            e.preventDefault();
            if (!CurrentUser || CurrentUser.role !== 'admin') return;
            const name = document.getElementById('cat-name').value.trim();
            const mode = document.getElementById('cat-mode').value;
            if (!name) return;
            if (DB.categories.some(c => (c.name || '').trim().toLowerCase() === name.toLowerCase())) { showToast('Tên nội dung này đã tồn tại.', 'warning'); return; }
            await persistCategory({ id: `cat_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`, name, mode, qualifiersPerGroup: 1 });
            closeModal();
            showToast('Đã thêm nội dung thi đấu!', 'success');
        }

        function renderStagesView() {
            const isAdmin = CurrentUser && CurrentUser.role === 'admin';
            if (DB.categories.length === 0) return `<div class="p-8 text-center text-neutral-400 text-sm">Chưa có nội dung thi đấu nào được tạo. Vui lòng tạo nội dung trước!</div>`;
            if (!UIState.activeCategoryTab || !DB.categories.some(c => c.id === UIState.activeCategoryTab)) UIState.activeCategoryTab = DB.categories[0].id;
            const categoryId = UIState.activeCategoryTab;
            const category = DB.categories.find(c => c.id === categoryId);
            const qualifiersPerGroup = Number(category?.qualifiersPerGroup) === 2 ? 2 : 1;
            const currentCatGroups = DB.groups.filter(g => g.categoryId === categoryId).sort(compareGroupNames);
            const knockout = getCategoryPlayoffMatches(categoryId);
            const allComplete = currentCatGroups.length > 0 && currentCatGroups.every(g => computeGroupStandings(g).complete);
            const canGenerate = currentCatGroups.length >= 2 && currentCatGroups.every(g => isGroupFullyComplete(g, qualifiersPerGroup)) && !knockout.length;
            const pairingHint = qualifiersPerGroup === 1
                ? 'Ghép Nhất Bảng 1 vs Nhất Bảng 2, Nhất Bảng 3 vs Nhất Bảng 4…'
                : 'Ghép cùng thứ hạng: Nhất Bảng 1 vs Nhất Bảng 2; Nhì Bảng 1 vs Nhì Bảng 2; tiếp tục tương tự…';

                        <div class="flex flex-wrap gap-2"><button type="button" onclick="openCreateGroupModal()" class="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white text-xs font-bold">+ Tạo / Import bảng đấu</button>${canGenerate ? `<button type="button" onclick="generatePlayoffBracket('${categoryId}')" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold">🏆 Tạo nhánh loại trực tiếp</button>` : ''}${knockout.length ? `<button type="button" onclick="requestDeletePlayoffBracket('${categoryId}')" class="px-4 py-2 rounded-xl bg-neutral-800 hover:bg-neutral-700 text-neutral-200 text-xs font-bold">↻ Xóa nhánh để tạo lại</button>` : ''}</div>

        function confirmClearAllMatches() {

        }

        async function deleteCloudCollectionDocuments(collectionName) {
            if (ConnectionState.mode !== 'cloud' || !firebaseUser || !db) return;
            try {
                const snap = await getDocs(getPublicCol(collectionName));
                const docs = snap.docs;
                for (let i = 0; i < docs.length; i += 400) {
                    await Promise.all(docs.slice(i, i + 400).map(item => deleteDoc(item.ref)));
                }
            } catch (e) {
                console.error(`Không thể xóa collection ${collectionName}:`, e);
                showToast(`Không thể xóa hết dữ liệu ${collectionName} trên Cloud.`, 'warning');
            }
        }

        async function executeClearAllMatches() {
            if (!CurrentUser || CurrentUser.role !== 'admin') return;
            DB.matches = [];
            DB.groups = [];
            DB.courts.forEach(c => { c.currentMatchId = ''; });
            broadcastLocalUpdate();
            renderApp();
            for (const court of DB.courts) await persistCourt(court);
            await deleteCloudCollectionDocuments('matches');
            await deleteCloudCollectionDocuments('groups');
            closeModal();
            showToast('Đã xóa toàn bộ lịch, bảng đấu và giải phóng tất cả sân!', 'success');
        }

        function renderScheduleView() {
            const isAdmin = CurrentUser && CurrentUser.role === 'admin';
            if (!DB.categories.length) return `<div class="p-8 text-center text-neutral-400 text-sm">Chưa có nội dung thi đấu nào. Admin cần tạo nội dung trước.</div>`;
            if (!UIState.activeScheduleCategoryTab || !DB.categories.some(c => c.id === UIState.activeScheduleCategoryTab)) UIState.activeScheduleCategoryTab = DB.categories[0].id;
            const categoryId = UIState.activeScheduleCategoryTab;
            const category = DB.categories.find(c => c.id === categoryId);
            const categoryGroups = DB.groups.filter(g => g.categoryId === categoryId);
            const currentMatches = getPublishedMatches(categoryId);
            const groupMatches = currentMatches.filter(m => m.stage !== 'knockout');
            const knockoutMatches = currentMatches.filter(m => m.stage === 'knockout');
            const statusLabel = status => status === 'live' ? 'Đang đấu' : status === 'finished' ? 'Đã kết thúc' : status === 'waiting' ? 'Chờ kết quả vòng trước' : status === 'bye' ? 'Vượt vòng (BYE)' : 'Chờ đấu';
            const statusClass = status => status === 'live' ? 'bg-red-950 text-red-300' : status === 'finished' ? 'bg-rose-950 text-rose-300' : status === 'waiting' ? 'bg-amber-950 text-amber-300' : status === 'bye' ? 'bg-rose-950 text-rose-300' : 'bg-neutral-800 text-neutral-300';
            const renderMatch = (m, idx) => {
                const court = m.courtId ? DB.courts.find(c => Number(c.id) === Number(m.courtId)) : null;
                const score = m.scoreState;
                const scoreText = score ? `${score.setsWonA || 0} - ${score.setsWonB || 0}` : '—';
                const pointsText = score ? (score.sets || []).map((set, i) => (set.a || set.b ? `V${i + 1}: ${set.a}-${set.b}` : '')).filter(Boolean).join(' · ') : '';
                return `<div class="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3"><div class="min-w-0"><div class="text-[10px] text-rose-300 font-bold">${escapeHtml(m.roundName || `Trận ${idx + 1}`)}</div><div class="text-sm font-extrabold text-white mt-1 break-words">${escapeHtml(m.teamA?.name || 'Chờ đội')} <span class="text-neutral-500 mx-1">VS</span> ${escapeHtml(m.teamB?.name || 'Chờ đội')}</div><div class="text-[10px] text-neutral-500 mt-1">${court ? escapeHtml(court.name) : 'Chưa phân sân'}${pointsText ? ` · ${pointsText}` : ''}</div></div><div class="flex items-center gap-3 sm:justify-end"><div class="text-right"><div class="font-mono text-lg font-black text-white">${scoreText}</div><span class="px-2.5 py-1 inline-block rounded-full text-[10px] font-bold ${statusClass(m.status)}">${statusLabel(m.status)}</span></div>${isAdmin && m.status === 'pending' && m.teamA?.id && m.teamB?.id ? `<button type="button" onclick="setActiveTab('live')" class="px-3 py-2 rounded-lg bg-rose-600 text-white text-[10px] font-bold">Phân sân</button>` : ''}</div></div>`;
            };
            const rounds = new Map();
            knockoutMatches.forEach(m => { const key = Number(m.roundIndex || 0); if (!rounds.has(key)) rounds.set(key, []); rounds.get(key).push(m); });
            return `<div class="space-y-4">
                ${isAdmin ? `<div class="p-4 rounded-2xl bg-neutral-900 border border-neutral-800 flex flex-wrap gap-2 items-center justify-between"><div><span class="text-xs text-neutral-300 font-bold">Quản lý lịch thi đấu · ${escapeHtml(category?.name || '')}</span><p class="text-[10px] text-neutral-500 mt-1">Trận vòng bảng và nhánh loại trực tiếp đều hiển thị tại đây.</p></div><button type="button" onclick="confirmClearAllMatches()" class="px-4 py-2 rounded-xl bg-rose-950 text-rose-200 text-xs font-bold">🗑️ Xóa toàn bộ lịch & bảng</button></div>` : ''}
                <div class="flex items-center gap-2 border-b border-neutral-800 pb-3 overflow-x-auto">${DB.categories.map(cat => `<button type="button" onclick="setActiveScheduleCategoryTab('${cat.id}')" class="px-4 py-2 rounded-xl text-xs font-extrabold ${categoryId === cat.id ? 'bg-red-600 text-white' : 'bg-neutral-900 text-neutral-400'}">🏸 ${escapeHtml(cat.name)}</button>`).join('')}</div>
                <div class="grid grid-cols-3 gap-2"><div class="p-3 rounded-xl bg-neutral-900 border border-neutral-800"><div class="text-lg font-black text-white">${currentMatches.length}</div><div class="text-[10px] text-neutral-500">Tổng trận / nhánh</div></div><div class="p-3 rounded-xl bg-neutral-900 border border-neutral-800"><div class="text-lg font-black text-red-400">${currentMatches.filter(m => m.status === 'live').length}</div><div class="text-[10px] text-neutral-500">Đang đấu</div></div><div class="p-3 rounded-xl bg-neutral-900 border border-neutral-800"><div class="text-lg font-black text-rose-400">${currentMatches.filter(m => m.status === 'finished').length}</div><div class="text-[10px] text-neutral-500">Đã xong</div></div></div>
                ${!groupMatches.length && !knockoutMatches.length ? `<div class="py-12 px-6 text-center text-neutral-400 text-xs border border-dashed border-neutral-800 rounded-2xl bg-neutral-900/50"><p class="font-bold text-white text-sm">Chưa có lịch thi đấu trong nội dung này</p><p class="mt-2">Tạo bảng đấu và chọn đủ đội ở mục Vòng Bảng hoặc import bảng từ Excel. Trước bước đó hệ thống không hiển thị trận.</p>${isAdmin ? `<button type="button" onclick="setActiveTab('stages')" class="mt-3 px-4 py-2 rounded-xl bg-red-600 text-white font-bold">Đi đến tạo bảng đấu</button>` : ''}</div>` : ''}
                ${categoryGroups.map(group => {
                    const matches = groupMatches.filter(m => m.groupId === group.id);
                    if (!matches.length) return '';
                    return `<section class="rounded-2xl bg-neutral-900 border border-neutral-800 overflow-hidden"><div class="px-4 py-3 border-b border-neutral-800 flex items-center justify-between"><div><h3 class="text-sm font-extrabold text-white">${escapeHtml(group.name)}</h3><p class="text-[10px] text-neutral-500">${group.teams.length} đội · ${matches.length} trận</p></div><span class="text-[10px] text-red-400 font-bold">VÒNG BẢNG</span></div><div class="divide-y divide-neutral-800">${matches.map(renderMatch).join('')}</div></section>`;
                }).join('')}
                ${rounds.size ? `<section class="rounded-2xl bg-neutral-900 border border-rose-800 p-4 space-y-3"><h3 class="text-sm font-extrabold text-white">🏆 Nhánh loại trực tiếp</h3><div class="grid grid-cols-1 md:grid-cols-${Math.min(rounds.size, 4)} gap-3">${[...rounds.entries()].sort((a,b)=>a[0]-b[0]).map(([r, ms]) => `<div><div class="text-[10px] font-bold text-rose-300 uppercase mb-2">${escapeHtml(ms[0]?.roundName || `Vòng ${r+1}`)}</div><div class="space-y-2">${ms.map(renderMatch).join('')}</div></div>`).join('')}</div></section>` : ''}
            </div>`;
        }

        function renderAthletesCardsHtml() {
            const list = DB.athletes.filter(a => a.name.toLowerCase().includes(UIState.athleteSearch.toLowerCase()) || (a.club || '').toLowerCase().includes(UIState.athleteSearch.toLowerCase()) || (a.phone || '').includes(UIState.athleteSearch));
            if (list.length === 0) {
                return `<div class="col-span-3 py-10 text-center text-neutral-500 text-xs">Không tìm thấy vận động viên phù hợp.</div>`;
            }
            return list.map(a => `
                <div class="p-4 rounded-2xl bg-neutral-900 border border-neutral-800 flex items-center justify-between">
                    <div>
                        <div class="text-sm font-extrabold text-white">${escapeHtml(a.name)}</div>
                        <div class="text-xs text-neutral-400">${escapeHtml(a.club || 'Tự do')} • ${escapeHtml(a.phone || 'Chưa có SĐT')}</div>
                    </div>
                    <button type="button" onclick="deleteAthlete('${a.id}')" class="px-2.5 py-1.5 rounded-lg bg-rose-950 text-rose-300 text-xs font-bold">Xóa</button>
                </div>
            `).join('');
        }

        function renderAthletesView() {
            return `
                <div class="space-y-4">
                    <div class="p-4 rounded-2xl bg-neutral-900 border border-neutral-800 flex flex-wrap items-center justify-between gap-3">
                        <input type="text" id="athlete-search-input" value="${escapeHtml(UIState.athleteSearch)}" oninput="setAthleteSearch(this.value)" placeholder="🔍 Tìm kiếm VĐV theo tên, SĐT, CLB..." class="w-80 px-3 py-2 bg-neutral-950 border border-neutral-700 rounded-xl text-xs text-white">
                        <div class="flex items-center gap-2">
                            <button type="button" onclick="confirmDeleteAllAthletes()" class="px-4 py-2 rounded-xl bg-rose-950 text-rose-200 text-xs font-bold">🗑️ Xóa tất cả</button>
                            <button type="button" onclick="openCreateAthleteModal()" class="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white text-xs font-bold">+ Thêm VĐV / Import CSV</button>
                        </div>
                    </div>
                    <div id="athletes-grid-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                        ${renderAthletesCardsHtml()}
                    </div>
                </div>
            `;
        }

        function renderCategoriesView() {
            return `
                <div class="space-y-4">
                    <div class="p-4 rounded-2xl bg-neutral-900 border border-neutral-800 flex items-center justify-between">
                        <div>
                            <h2 class="text-base font-extrabold text-white">Nội Dung Thi Đấu</h2>
                            <p class="text-xs text-neutral-400">Định nghĩa các hạng mục trước khi chia bảng</p>
                        </div>
                        <button type="button" onclick="openCreateCategoryModal()" class="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white text-xs font-bold">+ Thêm Nội Dung</button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        ${DB.categories.map(c => `
                            <div class="p-4 rounded-2xl bg-neutral-900 border border-neutral-800 flex items-center justify-between">
                                <div>
                                    <div class="text-sm font-bold text-white">${escapeHtml(c.name)}</div>
                                    <div class="text-[11px] text-red-400 font-bold">${c.mode === 'doubles' ? 'Đánh Đôi' : 'Đánh Đơn'}</div>
                                </div>
                                <button type="button" onclick="deleteCategory('${c.id}')" class="px-2.5 py-1.5 rounded-lg bg-rose-950 text-rose-300 text-xs font-bold">Xóa</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderRefereesManagementView() {
            const referees = DB.users.filter(u => u.role === 'referee');
            return `
                <div class="space-y-4">
                    <div class="p-4 rounded-2xl bg-neutral-900 border border-neutral-800 flex items-center justify-between">
                        <h2 class="text-base font-extrabold text-white">Quản Lý Trọng Tài</h2>
                        <button type="button" onclick="openCreateRefereeModal()" class="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white text-xs font-bold">+ Tạo Trọng Tài</button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        ${referees.map(r => `
                            <div class="p-4 rounded-2xl bg-neutral-900 border border-neutral-800 flex items-center justify-between">
                                <div>
                                    <div class="text-sm font-extrabold text-white">${escapeHtml(r.name)}</div>
                                    <div class="text-xs text-rose-400 font-mono">User: ${escapeHtml(r.username)}</div>
                                </div>
                                <button type="button" onclick="deleteUser('${r.id}')" class="px-2.5 py-1.5 rounded-lg bg-rose-950 text-rose-300 text-xs font-bold">Xóa</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderApp() {
            const appEl = document.getElementById('app');
            if (!appEl) return;
            const isAdmin = CurrentUser && CurrentUser.role === 'admin';
            let mainContent = '';
            const cloudReady = ['users', 'courts', 'categories', 'athletes', 'groups', 'matches'].every(name => cloudCollectionsReady.has(name));
            if (ConnectionState.mode === 'connecting' || (ConnectionState.mode === 'cloud' && !cloudReady)) {
                mainContent = `<div class="p-12 text-center text-neutral-300"><div class="text-2xl mb-3">☁️</div><div class="font-bold">Đang tải dữ liệu giải đấu...</div><div class="text-xs text-neutral-500 mt-2">Lịch và bảng đấu sẽ hiển thị sau khi đồng bộ hoàn tất.</div></div>`;
            }
            else if (UIState.activeCourtId !== null) mainContent = renderRefereeScoreboardView();
            else if (UIState.activeTab === 'stages') mainContent = renderStagesView();
            else if (UIState.activeTab === 'schedule') mainContent = renderScheduleView();
            else if (UIState.activeTab === 'athletes' && isAdmin) mainContent = renderAthletesView();
            else if (UIState.activeTab === 'categories' && isAdmin) mainContent = renderCategoriesView();
            else if (UIState.activeTab === 'referees' && isAdmin) mainContent = renderRefereesManagementView();
            else mainContent = renderLiveCourtsView();

            appEl.innerHTML = `
                ${renderHeader()}
                <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 py-5">${mainContent}</main>
            `;
            if (window.lucide) window.lucide.createIcons();
        }

        Object.assign(window, {
            closeModal, openLoginModal, handleLoginModal: handleLoginSubmit, logoutUser, setActiveTab, setActiveCategoryTab, setActiveScheduleCategoryTab,
            openCourtScoreboard, closeCourtScoreboard, setAthleteSearch, assignRefereeToCourt,
            openAssignMatchModal, openAssignMatchModalForCategory, handleAssignMatchToCourt, unassignMatchFromCourt, addPoint, undoPoint,
            manualSetServer, chooseDoublesServer, forceEndSet, forceEndMatch,
            openCreateGroupModal, handleGroupCategoryChange, handleTeamCountChange, handleCreateGroupSubmit, filterGroupAthletes, chooseGroupAthlete, importGroupsFromExcel, downloadGroupImportTemplate, generatePlayoffBracket, updateQualifiersPerGroup, requestDeletePlayoffBracket, executeDeletePlayoffBracket, deleteGroup,
            openCreateAthleteModal, handleAthletesImport, handleCreateAthleteSubmit, deleteAthlete, downloadAthleteImportTemplate,
            confirmDeleteAllAthletes, executeDeleteAllAthletes, confirmClearAllMatches, executeClearAllMatches, openCreateCategoryModal,
            handleCreateCategorySubmit, deleteCategory, openCreateRefereeModal, handleCreateRefereeSubmit, deleteUser,
            openCloudSettingsModal, handleConnectCloudSubmit, retryCloudConnection
        }, { handleLoginSubmit });

        window.addEventListener('online', () => {
            if (ConnectionState.mode !== 'cloud') retryCloudConnection();
            else flushPendingAthleteChanges({ silent: true });
        });
        window.addEventListener('offline', () => {
            ConnectionState.mode = 'local';
            ConnectionState.errorMessage = 'Thiết bị đang ngoại tuyến. Dữ liệu mới chỉ lưu tạm trên thiết bị.';
            renderApp();
        });

        window.addEventListener('DOMContentLoaded', () => {
            saveLocalSnapshot();
            renderApp();
            // Firebase configuration is bundled with this app. No per-device cloud code is required.
            if (activeFirebaseConfig && activeFirebaseConfig.apiKey) connectToFirebase(activeFirebaseConfig);
        });
    </script>
</body>
</html>
